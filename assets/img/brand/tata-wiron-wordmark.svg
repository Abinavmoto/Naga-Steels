<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tata Wiron, supply-relationship wordmark.

  This is a TYPE LOCKUP, not a reproduction of the Tata Wiron logo.
  Reproducing a third party's registered mark needs their permission,
  which we do not have on file, and a dealer claim is exactly the thing
  a brand owner challenges. Setting the name in neutral type states the
  supply relationship without appropriating the identity.

  ⚠ The dealer relationship itself is unverified. See OWNER-CHECKLIST.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150"
     role="img" aria-labelledby="tw-title">
  <title id="tw-title">Tata Wiron wire products, supplied in Madurai</title>
  <rect width="520" height="150" rx="10" fill="#ffffff"/>
  <text x="28" y="58" fill="#18362b" font-family="Arial, Helvetica, sans-serif"
        font-size="36" font-weight="800" letter-spacing="5">TATA</text>
  <text x="27" y="114" fill="#18362b" font-family="Arial, Helvetica, sans-serif"
        font-size="55" font-weight="800" letter-spacing="1">W</text>
  <text x="73" y="114" fill="#007a3d" font-family="Arial, Helvetica, sans-serif"
        font-size="55" font-weight="800" letter-spacing="1">I</text>
  <text x="89" y="114" fill="#18362b" font-family="Arial, Helvetica, sans-serif"
        font-size="55" font-weight="800" letter-spacing="1">RON</text>
  <path d="M329 31h158" stroke="#d9ddd8" stroke-width="2"/>
  <text x="329" y="64" fill="#5c625d" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" letter-spacing="2">WIRE PRODUCTS</text>
  <text x="329" y="91" fill="#006837" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" letter-spacing="2">SUPPLIED IN MADURAI</text>
</svg>
