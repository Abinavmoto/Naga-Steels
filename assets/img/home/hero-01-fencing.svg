       Subject must sit in the TOP 55%. The bottom 40% is covered by the
       scrim and the headline block, so anything placed there is lost. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14402A"/>
      <stop offset=".55" stop-color="#0D2E1D"/>
      <stop offset="1" stop-color="#10251A"/>
    </linearGradient>
    <pattern id="weave" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 45h90M45 0v90" stroke="#CDA535" stroke-opacity=".16" stroke-width="3" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="1800" fill="url(#g)"/>
