  <text x="600" y="672" fill="#FFFFFF" fill-opacity=".82" font-family="system-ui,sans-serif" font-size="34" font-weight="600" text-anchor="middle">FENCING</text>
  <text x="600" y="930" fill="#FFFFFF" fill-opacity=".58" font-family="system-ui,sans-serif" font-size="30" text-anchor="middle">Replace with chain-link photography</text>
  <text x="600" y="980" fill="#CDA535" fill-opacity=".7" font-family="monospace" font-size="26" text-anchor="middle">1200 × 1800 · 2:3</text>
